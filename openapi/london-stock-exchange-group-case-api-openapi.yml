      description: "Enumeration that defines the detail level of the search response:\n  - 'CASE': The search response will provide full Case details.\n  - 'CASE_AND_RESULTS': The search response will include Сase details and Result summary related to this Case.\n  - 'CASE_AND_AGGREGATED_RESULTS': The search response will provide full Case details with an aggregated Result summary, summarizing data from primary and sub-cases.\n  - 'CASE_AND_RESULTS_AND_AGGREGATED_RESULTS': The search response will provide full Case details with a Result and aggregated(summarizing data from primary and sub-cases) summaries.\n"
      enum:
      - CASE
      - CASE_AND_RESULTS
      - CASE_AND_AGGREGATED_RESULTS
      - CASE_AND_RESULTS_AND_AGGREGATED_RESULTS
    Name:
      type: object
      required:
      - fullName
      - type
      properties:
        fullName:
          type: string
        givenName:
          type: string
        languageCode:
          $ref: '#/components/schemas/LanguageCode'
        lastName:
          type: string
        originalScript:
          type: string
        prefix:
          type: string
        suffix:
          type: string
        type:
          type: string
          description: Watchlist Profile Name Type enumeration
          enum:
          - PRIMARY
          - AKA
          - AKAENHANCED
          - FKA
          - DBA
          - MAIDEN
          - LANG_VARIATION
          - PREVIOUS
          - VEHICLE_ID
          - LOW_QUALITY_AKA
          - NATIVE_AKA
    Resolution:
      type: object
      description: Resolution details of a Result.
      allOf:
      - $ref: '#/components/schemas/AbstractResolution'
      - type: object
        properties:
          resolutionDate:
            type: string
            format: date-time
            description: Represents the date and time when this Result was last resolved.
    CaseBulkArchiveRequest:
      type: object
      description: A request body on Bulk Update Archive States
      required:
      - archive
      - caseSystemIds
      properties:
        archive:
          type: boolean
          description: A flag indicating whether to Bulk Archive (`true`) or Unarchive (`false`) Cases.
        caseSystemIds:
          type: array
          description: An array of system generated Ids for the Cases
          items:
            type: string
            description: System generated Id for the Case
        note:
          type: string
          maxLength: 1000
          description: Note added by the user.
      example:
        archive: true
        caseSystemIds:
        - caseSystemId1
        - caseSystemId2
        - caseSystemId3
        note: Audit note
    AbstractCaseSearchModel:
      type: object
      description: "Request model used to search within, sort across, paginate through, and filter down the set of Cases.\n\nA model contains 'query', 'filter' expression, which is written in a superset of the Atom Feed Item Query Language (FIQL).\n\nThe FIQL is documented in <https://tools.ietf.org/html/draft-nottingham-atompub-fiql-00>,\nand the superset supported by the WC1 API documented in <https://github.com/jirutka/rsql-parser>.\n\nRSQL/FIQL parser contains some reserved characters:\n\n`'\"' | \"'\" | \"(\" | \")\" | \";\" | \",\" | \"=\" | \"!\" | \"~\" | \"<\" | \">\"`\n\nIf there are reserved characters or white spaces in the query expression, they must be escaped by enclosing \nthem in single or double quotes. If you need to use both single and double quotes inside an argument, then\nyou must escape one of them using `\\` (backslash). If you want to use `\\` literally, then double it as `\\\\`.\nBackslash has a special meaning only inside a quoted argument, not in unquoted argument. Using reserved \ncharacters or white spaces without escaping can lead to parsing and execution errors.\n\nThe query examples:\n\n* \"query\": \"example=='TE!ST'\"\n* \"query\": \"example==\\\\\"TE'ST\\\\\"\"\n* \"query\": \"example=='TE\\\\\\\\'ST'\"\n\nArgument can be a single value, or multiple values in parenthesis separated by comma. Value that does not\ncontain any reserved character or a white space can be unquoted, other arguments must be enclosed in single \nor double quotes.\n\nExample:\n\n* \"query\": \"example1=='TE\\\\\\\\'ST', example2==TEST\"\n"
      properties:
        query:
          type: string
          description: 'A string containing the search query.

            **Note:** To find the available search fields, check for fields with ''QUERY'' type in the `GET /reference/searchFilters` endpoint.

            '
        filter:
          type: string
          description: 'A string containing filter criteria.

            **Note:** To find the available search fields, check for fields with ''FILTER'' type in the `GET /reference/searchFilters` endpoint.

            '
        detailLevel:
          description: The detail level of the search response.
          $ref: '#/components/schemas/CaseDetailLevel'
        sort:
          type: array
          description: "An array of sorting criteria.\n\nThe list of available sort parameter names:\n- 'primaryName' - sort by the primary name for the Case;\n- 'caseId' - sort by the unique identifier for the Case;\n- 'caseSystemId' - sort by the system-generated ID for the Case;\n- 'creationDate' - sort by the time when the Case has been created;\n- 'modificationDateByUser' - sort by the time when the Case has been modified by the User;\n- 'modificationDateBySystem' - sort by the time when the Case has been modified by the system;\n- 'lastScreenedDate' - sort by the time when the Case was last screened;\n- 'primaryCase' - sort by the total child Cases count contained within the Case;  \n- 'nameTransposition' - sort by the name transposition state for the Case;\n- 'lifecycleState' - sort by the lifecycle state for the Case;\n- 'watchlistCaseScreeningState' - sort by the World-Check ongoing screening state for the Case;\n- 'mediaCheckCaseScreeningState' - sort by the Media-Check ongoing screening state for the Case;\n- 'entityType' - sort by the entity type for the Case;\n- 'caseRating' - sort by the rating for the Case;\n- 'mandatoryActions' - sort by the number of mandatory actions on this Case;\n- 'watchlistUnresolved' - sort by the count of unresolved matches with the provider type 'WATCHLIST';\n- 'watchlistReviewRequired' - sort by the count of matches with the provider type 'WATCHLIST' that require review;\n- 'clientWatchlistUnresolved' - sort by the count of unresolved matches with the provider type 'CLIENT_WATCHLIST';\n- 'clientWatchlistReviewRequired' - sort by the count of matches with the provider type 'CLIENT_WATCHLIST' that require review;\n- 'mediaCheckReviewRequired' - sort by the count of matches with the provider type 'MEDIA_CHECK' that require review;\n- 'secondaryFieldCountryLocation' - sort by the country location or registered country secondary field value;\n- 'secondaryFieldNationality'  - sort by the citizenship secondary field value;\n- 'secondaryFieldPlaceOfBirth' - sort by the place of birth secondary field value;\n- 'groupId' - sort by the name of the Group owning the Case;\n- 'creatorUserId' - sort by the full name of the User who created the Case;\n- 'modifierUserId' - sort by the full name of the User who modified the Case;\n- 'assigneeUserId' - sort by the full name of the User the Case is currently assigned to.\n"
          items:
            $ref: '#/components/schemas/SortCriterion'
    ResultsReview:
      type: object
      description: Entity to set the review remark of supplied result IDs
      required:
      - resultIds
      - remark
      properties:
        resultIds:
          type: array
          description: Result IDs of the case we are wishing to review
          uniqueItems: true
          items:
            type: string
        remark:
          type: string
          description: The review remark we wish to assign to the supplied result IDs
    ScreeningStatusResponse:
      type: object
      description: 'Contains status and aggregated screening result for each requested case.

        If ''requestFromScreenedDate'' less than ''lastScreenedDate'' then status equals ''NOT_SCREENED'' else status equals ''SCREENED''.

        '
      required:
      - caseSystemId
      - screeningStatus
      - requestFromScreenedDate
      - providerSummaries
      properties:
        caseSystemId:
          type: string
          description: System-generated ID for a successfully created Case.
          maxLength: 192
        screeningStatus:
          type: string
          description: Case Screening State Enumeration representing type of Screening
          enum:
          - NOT_SCREENED
          - SCREENED
        requestFromScreenedDate:
          type: string
          format: date-time
          description: Date and time of Last Case Screening in ISO 8601 format excluding Week and Ordinal dates.
          maxLength: 255
        lastScreenedDate:
          type: string
          format: date-time
          description: Date and time of Last performed Case Screening in ISO 8601 format excluding Week and Ordinal dates.
          maxLength: 255
        providerSummaries:
          type: object
          description: 'Contains enabled for this Case ProviderType(s).

            Supported ProviderType [WATCHLIST], [CLIENT_WATCHLIST], [MEDIA_CHECK] and [PASSPORT_CHECK].

            '
          additionalProperties:
            $ref: '#/components/schemas/ProviderTypeSummaryResult'
      example:
      - caseSystemId: Case System ID 1
        requestFromScreenedDate: '2016-07-27T15:35:10Z'
        lastScreenedDate: '2016-07-27T15:30:10Z'
        providerSummaries:
          WATCHLIST:
            status: SCREENED
            totalMatches: 120
            reviewRequired: 20
            unresolved: 17
          PASSPORT_CHECK:
            isReviewRequired: false
      - caseSystemId: Case System ID 2
        requestFromScreenedDate: '2016-07-27T15:35:10Z'
        lastScreenedDate: '2016-07-27T15:30:10Z'
        providerSummaries:
          WATCHLIST:
            status: NOT_SCREENED
            totalMatches: 0
            reviewRequired: 0
            unresolved: 0
    PaginationReferenceResponse:
      type: object
      description: Response model containing pagination details.
      properties:
        itemsPerPage:
          type: integer
          description: The number of items per page.
          format: int32
        totalItems:
          type: integer
          description: The total number of items available.
          format: int64
        pageReferences:
          description: Pagination details including items per page, total items, and page references.
          $ref: '#/components/schemas/PageReference'
  responses:
    CannotReturnResponse:
      description: Cannot return response
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
        application/octet-stream:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: The API client is making too many concurrent requests, and some are being throttled. Throttled requests can be retried (with an updated request Date and HTTP signature) after a short delay.
    Unauthorized:
      description: The request has failed an authorisation check. This can happen for a variety of reasons, such as an invalid or expired API key, an invalid HMAC signature or a request timing issue/problem with the Date header value. The API client should ensure a correctly synchronised clock is used to generate request timestamps.
    UnexpectedError:
      description: Unexpected error
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
        application/octet-stream:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
    UnsupportedMediaType:
      description: For requests with payloads, an unsupported Content-Type was specified. The World-Check One API only supports a content type of application/json.
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
        application/octet-stream:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
        application/octet-stream:
          schema:
            type: array
            items:
              $ref: '#/components/schemas/Error'
