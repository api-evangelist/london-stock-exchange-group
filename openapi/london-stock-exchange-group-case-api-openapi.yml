          - BIOGRAPHY
          - FUNDING
          - IDENTIFICATION
          - NOTE
          - REPORTS
          - REGULATION
          - SANCTION
          - UNKNOWN
        text:
          type: string
        title:
          type: string
          maxLength: 255
