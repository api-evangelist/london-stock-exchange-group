            description: "The starting date from which the records of the case in NameMatcher were indexed. \nThis field is only applicable for Zero Footprint Screening (ZFS).\n"
          endScreeningDate:
            type: string
            format: date-time
            description: "The ending date from which the records of the case in NameMatcher were indexed. \nThis field is only applicable for Zero Footprint Screening (ZFS).\n"
        example:
          name: John Smith
          caseId: Client Case Id
          groupId: Client Group Id
          entityType: INDIVIDUAL
          providerTypes:
          - WATCHLIST
          - MEDIA_CHECK
          caseScreeningState:
            WATCHLIST: INITIAL
            MEDIA_CHECK: ONGOING
          startScreeningDate: 2020-08-01 15:00:00.003000+00:00
          endScreeningDate: 2021-08-02 15:00:00.003000+00:00
          customFields:
          - typeId: Custom Field Id 1
            value: Reference ID 1234567
          - typeId: Custom Field Id 2
            value: Deal Id 1234567
          secondaryFields:
          - typeId: SFCT_1
            value: MALE
          - typeId: SFCT_2
            dateTimeValue: '1990-11-20'
