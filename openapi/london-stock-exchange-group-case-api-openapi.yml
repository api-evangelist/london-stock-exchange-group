          type: string
        region:
          type: string
        street:
          type: string
    Assignee:
      type: object
      required:
      - userId
      properties:
        userId:
          type: string
          maxLength: 255
          description: Identifier of the assignee user.
        note:
          type: string
          maxLength: 1000
          description: Note added by the user.
    CaseBulkLinkRequestCollection:
      type: object
      description: A request body on Bulk Update Case Links
      required:
      - link
      - relationshipType
      - caseSystemIds
      properties:
        link:
          type: boolean
          description: A flag indicating whether to Bulk Link (`true`) or Unlink (`false`) Cases.
        relationshipType:
          type: string
          description: Relationship type between cases.
          enum:
          - SUBCASE_TO_PRIMARY
          - PRIMARY_TO_SUBCASE
        caseSystemIds:
          type: array
          description: An array of case bulk link requests
          items:
            $ref: '#/components/schemas/CaseBulkLinkRequest'
        note:
          type: string
          maxLength: 1000
          description: Note added by the user.
      example:
        link: true
        relationshipType: SUBCASE_TO_PRIMARY
        caseSystemIds:
        - caseSystemId: caseSystemId1
        - relatedCaseSystemIds:
          - caseSystemId2
          - caseSystemId3
          - caseSystemId4
        - caseSystemId: caseSystemId5
        - relatedCaseSystemIds:
          - caseSystemId6
          - caseSystemId7
          - caseSystemId8
        note: Audit note
    CaseDetailed:
      type: object
      description: 'Defines complete Case data returned during a search operation.

        This model provides detailed information about a Case.

        '
      properties:
        caseId:
          type: string
          description: 'The unique identifier for the Case, which can be provided by the Client or generated by the system.

            This field is not applicable for ''Zero Footprint Screening (ZFS)''.

            '
          maxLength: 1000
        name:
          type: string
          description: The name used for screening this Case.
          maxLength: 1000
        providerTypes:
          type: array
          description: 'The provider types required to screen this Case.

            For ''Zero Footprint Screening (ZFS)'', only ''WATCHLIST'' and ''CLIENT_WATCHLIST'' are supported.

            '
          minItems: 1
          items:
            $ref: '#/components/schemas/ProviderType'
        customFields:
          type: array
          description: "Custom fields associated with this Case. \nDefinitions for available custom fields can be obtained via `GET /groups/{groupId}/caseTemplate` endpoint. \nCustom fields cannot be used with 'Zero Footprint Screening (ZFS)'.\n"
          items:
            $ref: '#/components/schemas/Field'
        secondaryFields:
          type: array
          description: "Secondary fields associated with this Case. \nDefinitions for available secondary fields can be obtained via `GET /groups/{groupId}/caseTemplate` endpoint.\n"
          items:
            $ref: '#/components/schemas/Field'
        groupId:
          type: string
          description: "The identifier of the group that owns this Case. \nThe group determines whether the case is screened as 'Zero Footprint Screening (ZFS)' or not.\n"
          maxLength: 255
        entityType:
          $ref: '#/components/schemas/CaseEntityType'
        caseSystemId:
          type: string
          description: The system-generated ID for the Case.
          maxLength: 1000
        caseScreeningState:
          type: object
          description: "A mapping from [ProviderType](#ProviderType) to indicate whether ongoing screening is enabled for this case on the specific [ProviderType](#ProviderType). \nBy default, the value is set from account settings.\n"
          additionalProperties:
            type: string
        lifecycleState:
          type: string
          description: Case Lifecycle State Enumeration.
          enum:
          - ARCHIVED
          - UNARCHIVED
        creator:
          $ref: '#/components/schemas/UserSummary'
        modifier:
          $ref: '#/components/schemas/UserSummary'
        assignee:
          $ref: '#/components/schemas/UserSummary'
        creationDate:
          type: string
          description: The date and time when the Case was created.
          format: date-time
        modificationDate:
          type: string
          description: The date and time when the Case was last modified.
          format: date-time
        lastScreenedDate:
          type: string
          description: The date and time when the Case was last screened.
          format: date-time
        modificationDateBySystem:
          type: string
          description: The date and time of the last modification to the Case by the system.
          format: date-time
        modificationDateByUser:
          type: string
          description: The date and time of the last modification to the Case by a User.
          format: date-time
        lastAuditEventActivity:
          type: string
          description: Type of action that caused the audit event to be created.
        caseRating:
          type: string
          description: Rating of the case.
          enum:
          - NO_RISK
          - LOW
          - MEDIUM
          - HIGH
          - UNKNOWN
          - NOT_RATED
        primaryCase:
          type: boolean
          description: A flag indicating whether this is a parent Case.
        nameTransposition:
          type: boolean
          description: A flag indicating whether name transposition is enabled for the Case.
        outstandingActions:
          type: boolean
          description: A flag indicating outstanding actions on a Case.
        batches:
          type: array
          description: The owning batch of the Case.
          items:
            $ref: '#/components/schemas/ItemIdentifier'
        noOfExcludedResults:
          type: integer
          description: The number of results that have been excluded from the result set due to auto-resolution rules.
          format: int32
        noOfAutoResolvedResults:
          type: integer
          description: The number of results that have been auto-resolved as 'False' due to auto-resolution rules.
          format: int32
        resultSummaries:
          $ref: '#/components/schemas/CaseResultSummaries'
        aggregatedResultSummaries:
          $ref: '#/components/schemas/CaseResultSummaries'
    Weblink:
