components:
  schemas:
    CaseBulkOngoingScreeningRequest:
      type: object
      description: A request body on Bulk Update Ongoing Screening States
      required:
      - caseScreeningState
      - caseSystemIds
      properties:
        caseScreeningState:
          type: object
          description: 'Mapping from ProviderType to toggle Ongoing Screening ON/OFF for these Cases on the specific ProviderType.

            Supported ProviderTypes [WATCHLIST, MEDIA_CHECK].

            '
          additionalProperties:
            type: string
        caseSystemIds:
          type: array
          description: An array of system generated Ids for the Cases
          items:
            type: string
            description: System generated Id for the Case
        note:
          type: string
          maxLength: 1000
          description: Note added by the user.
      example:
        caseScreeningState:
          WATCHLIST: INITIAL
          MEDIA_CHECK: ONGOING
        caseSystemIds:
        - caseSystemId1
        - caseSystemId2
        - caseSystemId3
        note: Audit note
    CaseResultSummaries:
      type: object
      description: Case Statistics contains the Category and the count for all the results in the Case.
      properties:
        totalMandatoryActions:
          type: integer
          format: int32
          description: The number of mandatory actions on this case
        totalSubCases:
          type: integer
          format: int32
          description: Holds a count of the number of child cases
        mediaCheck:
          $ref: '#/components/schemas/MediaCheckResultSummary'
        watchlist:
          $ref: '#/components/schemas/WatchlistResultSummary'
        clientWatchlist:
          $ref: '#/components/schemas/ClientWatchlistResultSummary'
    PaginationReferenceRequest:
      type: object
      description: Request model for defining pagination options.
      properties:
        itemsPerPage:
          type: integer
          description: The number of items to return per page.
          format: int32
        pageReference:
          type: string
          description: A reference to a specific page.
    ScreeningResultCollection:
      type: object
      description: Contains an array of Watchlist Screening Result objects from a synchronous screening operation.
      required:
      - results
      - name
      - providerTypes
      - groupId
      - entityType
      properties:
        caseId:
          type: string
          maxLength: 512
          description: 'Case ID provided by the client or else generated by the system for the client. No case ID will be returned

            when using Zero Footprint Screening (ZFS) and it should not be specified in the request either.

            '
        name:
          type: string
          maxLength: 1000
          description: Name to screen for this case.
        providerTypes:
          type: array
          description: 'Provider Types required to Screen this case.

            For Zero Footprint Screening (ZFS), only `WATCHLIST` is supported.

            '
          minItems: 1
          items:
            $ref: '#/components/schemas/ProviderType'
        customFields:
          description: 'Case Custom Fields. Available custom fields and their definitions can be obtained via

            `groups/{groupId}/caseTemplate`. Custom fields cannot be used with Zero Footprint Screening (ZFS).

            '
          type: array
          items:
            $ref: '#/components/schemas/Field'
        secondaryFields:
          description: 'Case Secondary Fields. Available secondary fields and their definitions can be obtained via

            `groups/{groupId}/caseTemplate`.

            '
          type: array
          items:
            $ref: '#/components/schemas/Field'
        groupId:
          type: string
          maxLength: 255
          description: 'Group identifier owning this case.

            The group determines whether the case is screened as Zero Footprint Screnning (ZFS) or not.

            '
        entityType:
          type: string
          description: Case Entity Type Enumeration
          enum:
          - INDIVIDUAL
          - ORGANISATION
          - VESSEL
          - UNSPECIFIED
        caseSystemId:
          type: string
          maxLength: 192
          description: System generated ID for the Case
        caseScreeningState:
          description: 'Mapping from ProviderType to indicate whether Ongoing Screening is enabled for this Case on the specific ProviderType.

            By default, value will be set from account settings.

            '
          type: object
          additionalProperties:
            type: string
        lifecycleState:
          type: string
          description: Case Lifecycle State Enumeration
          enum:
          - ARCHIVED
          - UNARCHIVED
        creator:
          $ref: '#/components/schemas/UserSummary'
        modifier:
          $ref: '#/components/schemas/UserSummary'
        assignee:
          $ref: '#/components/schemas/UserSummary'
        creationDate:
          type: string
          format: date-time
          description: Case creation date and time
        modificationDate:
          type: string
          format: date-time
          description: Case modification date and time
        nameTransposition:
          type: boolean
          description: Flag indicating whether name transposition is enabled for the case.
        outstandingActions:
          type: boolean
          description: Flag indicating outstanding actions on a Case
        lastScreenedDatesByProviderType:
          type: object
          description: Case screenings date and time by provider type.
          additionalProperties:
            type: string
            format: date-time
            maxLength: 255
            description: Date and time by Provider Type.
        lastIndexDatesByProviderType:
          type: object
          description: 'Case index date and time by provider type. Represents date and time that should be used during  ZFS screening as

            starting point to not lose any results. Available only for ZFS screening.

            '
          additionalProperties:
            type: string
            format: date-time
            maxLength: 255
            description: Date and time by Provider Type.
        providerTypeDetails:
          $ref: '#/components/schemas/ProviderTypeDetails'
        results:
          description: Contains the Screening Result objects of the screening.
          type: array
          items:
            $ref: '#/components/schemas/Result'
    CaseSummaryFilterResponse:
      type: object
      description: Filter the response
      properties:
        query:
          type: string
          description: "A query filter expression, which is written in a superset of the Atom Feed Item Query Language (FIQL).\nThe FIQL is documented in <https://tools.ietf.org/html/draft-nottingham-atompub-fiql-00>,\nand the superset supported by the WC1 API documented in <https://github.com/jirutka/rsql-parser>.\nThe query supports next field to specify searching criteria:\n\n'modificationDate' - Time when the case has been modified by the user;\n\n'assignedUserId' - Identifier of the User cases are assigned to;\n\n'groupId' - Identifier of the Group that owns the case.\n\n'creatorUserId' - Identifier of the case author\n\n'modifierUserId' - Identifier of the recent changes author\n\n'creationDate' - Time when the case has been created\n\nRSQL/FIQL parser contains some reserved characters:\n\n`'\"' | \"'\" | \"(\" | \")\" | \";\" | \",\" | \"=\" | \"!\" | \"~\" | \"<\" | \">\"`\n\nIf there are reserved characters or white spaces in the query expression, they must be escaped by enclosing \nthem in single or double quotes. If you need to use both single and double quotes inside an argument, then\nyou must escape one of them using `\\` (backslash). If you want to use `\\` literally, then double it as `\\\\`.\nBackslash has a special meaning only inside a quoted argument, not in unquoted argument. Using reserved \ncharacters or white spaces without escaping can lead to parsing and execution errors.\n\nThe query examples:\n\n* \"query\": \"example=='TE!ST'\"\n* \"query\": \"example==\\\\\"TE'ST\\\\\"\"\n* \"query\": \"example=='TE\\\\\\\\'ST'\"\n\nArgument can be a single value, or multiple values in parenthesis separated by comma. Value that does not\ncontain any reserved character or a white space can be unquoted, other arguments must be enclosed in single \nor double quotes.\n\nExample:\n\n* \"query\": \"example1=='TE\\\\\\\\'ST', example2==TEST\"\n"
        sort:
          type: array
          description: The sort critieria to apply to the query
          items:
            $ref: '#/components/schemas/SortCriterion'
