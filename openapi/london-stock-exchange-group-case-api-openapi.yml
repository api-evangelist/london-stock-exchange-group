      required:
      - totalResultCount
      properties:
        query:
          type: string
        sort:
          type: array
          description: The sort critieria to apply to the query
          items:
            $ref: '#/components/schemas/SortCriterion'
        pagination:
          $ref: '#/components/schemas/PaginationResponse'
        totalResultCount:
          type: integer
          format: int64
    Address:
      type: object
      properties:
