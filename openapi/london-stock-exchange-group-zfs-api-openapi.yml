          enum:
          - EMAIL
          - FAX
          - URL
          - VOICE
        country:
          $ref: '#/components/schemas/Country'
        detail:
          type: string
    FieldDefinition:
      type: object
      description: 'Secondary or Custom Field metadata describing the rules for populating the corresponding

        Field data when creating or updating a Case. Extends [AbstractField](#AbstractField).

        '
      allOf:
      - $ref: '#/components/schemas/AbstractField'
      - type: object
        required:
        - fieldValueType
        - label
        properties:
          fieldValueType:
            $ref: '#/components/schemas/FieldValueType'
          fieldRequired:
            type: boolean
            description: Indicates whether this field is required
            default: false
          label:
            type: string
            description: Human-readable label for this field
            maxLength: 1000
          regExp:
            type: string
            description: Optional regular expression which applies to fields where fieldValueType is TEXT
            maxLength: 255
    FieldValueType:
      type: string
      description: 'Enumerated value formats for a secondary / custom field.


        - GENDER can be one of enumerated values in `GenderType.UKNOWN/MALE/FEMALE`.

        - DATE is a Date in ISO 8601 format excluding Week and Ordinal dates.

        - COUNTRY is a ISO_3166-1_alpha-3 Country Code. All supported country codes can be obtained via `/reference/countries`.

        - PASSPORT_DOCUMENT_TYPE can be screened by `ProviderType.PASSPORT_CHECK`.

        - STATE - a State/Country type used by `ProviderType.PASSPORT_CHECK` for nationality and passport issuing state.

        - TEXT is a string.

        '
      enum:
      - COUNTRY
      - DATE
      - GENDER
      - PASSPORT_DOCUMENT_TYPE
      - STATE
      - TEXT
    AbstractResolution:
      type: object
      description: Abstract resolution object
      properties:
        statusId:
          type: string
          description: 'Unique status ID defined in Group''s resolution toolkit and used when resolving this Result. Get the available

            status IDs and their details via `groups/{group_id}/resolutionToolkit`.

            '
          maxLength: 255
        riskId:
          type: string
          description: 'Unique risk ID defined in Group''s resolution toolkit and used when resolving this Result. Get the available

            risk IDs and their details via `groups/{group_id}/resolutionToolkit`.

            '
          maxLength: 255
        reasonId:
          type: string
          description: 'Unique reason ID defined in Group''s resolution toolkit and used when resolving this Result. Get the available

            reason IDs and their details via `groups/{group_id}/resolutionToolkit`.

            '
          maxLength: 255
        resolutionRemark:
          type: string
          description: Resolution remark added when resolving this Result.
          maxLength: 1000
    Detail:
