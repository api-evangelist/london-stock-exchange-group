    Result:
      type: object
      description: 'Result found after performing a synchronous screening of a Case.

        This contains the abstract case screening result details plus includes identity documents and important events

        '
      allOf:
      - $ref: '#/components/schemas/AbstractScreeningResult'
      - type: object
        required:
